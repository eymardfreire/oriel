[project]
name = "oriel-server"
version = "0.1.0"
description = "Oriel aggregation service. Serves health, wires, and market quotes."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx2",
  "pytest>=8",
]

[project.scripts]
oriel-server = "oriel_server.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oriel_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
